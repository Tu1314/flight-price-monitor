name: Flight Price Monitor

on:
  schedule:
    # 每天 01:00 / 07:00 / 13:00 / 19:00 UTC（北京时间 09/15/21/03 点）
    - cron: '0 0,1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      from_code:
        description: '出发地三字码 (如 CTU)'
        required: true
        default: 'CTU'
      from_name:
        description: '出发地名称 (如 成都)'
        required: true
        default: '成都'
      to_code:
        description: '目的地三字码 (如 TSN)'
        required: true
        default: 'TSN'
      to_name:
        description: '目的地名称 (如 天津)'
        required: true
        default: '天津'
      depart_dates:
        description: '去程日期, 逗号分隔 (如 2026-09-30,2026-10-01)'
        required: true
        default: '2026-09-30,2026-10-01,2026-10-02'
      return_dates:
        description: '回程日期, 逗号分隔 (可选)'
        required: false
        default: ''
      trip_type:
        description: '行程类型'
        required: true
        type: choice
        options:
          - one_way
          - round_trip
        default: one_way
      platforms:
        description: '平台: fliggy,tuniu,qunar,tongcheng,ctrip'
        required: false
        default: 'fliggy,tuniu,qunar,tongcheng'
      threshold:
        description: '低价提醒阈值（元）'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Build config from workflow_dispatch or defaults
        if: github.event_name == 'workflow_dispatch'
        env:
          # SERVERCHAN_SEND_KEY is documented; SERVERCHAN_KEY is supported
          # for compatibility with existing repository secrets.
          SERVERCHAN_SEND_KEY: ${{ secrets.SERVERCHAN_SEND_KEY || secrets.SERVERCHAN_KEY }}
        run: |
          python scripts/build_config.py \
            --from-code "${{ github.event.inputs.from_code || 'CTU' }}" \
            --from-name "${{ github.event.inputs.from_name || '成都' }}" \
            --to-code "${{ github.event.inputs.to_code || 'TSN' }}" \
            --to-name "${{ github.event.inputs.to_name || '天津' }}" \
            --dates "${{ github.event.inputs.depart_dates || '2026-09-30,2026-10-01,2026-10-02' }}" \
            --return-dates "${{ github.event.inputs.return_dates || '' }}" \
            --trip-type "${{ github.event.inputs.trip_type || 'one_way' }}" \
            --platforms "${{ github.event.inputs.platforms || 'fliggy,tuniu,qunar,tongcheng' }}" \
            --threshold "${{ github.event.inputs.threshold || '0' }}" \
            --output config.yaml

      - name: Run price monitor (one round)
        run: python main.py --once
        timeout-minutes: 15

      - name: Export latest results to JSON
        run: |
          mkdir -p docs/data
          python scripts/export_results.py \
            --db data/prices.db \
            --out docs/data/latest.json

      - name: Render HTML report
        run: |
          python scripts/render_report.py \
            --results-file docs/data/latest.json \
            --out-dir docs/data

      - name: Commit data & report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update price data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
