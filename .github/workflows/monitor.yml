name: Flight Price Monitor

on:
  schedule:
    # 姣忓ぉ 01:00 / 07:00 / 13:00 / 19:00 UTC锛堝寳浜椂闂?09/15/21/03 鐐癸級
    - cron: '0 0,1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      from_code:
        description: '鍑哄彂鍦颁笁瀛楃爜 (濡?LZO)'
        required: true
        default: 'LZO'
      from_name:
        description: '鍑哄彂鍦板悕绉?(濡?娉稿窞)'
        required: true
        default: '娉稿窞'
      to_code:
        description: '鐩殑鍦颁笁瀛楃爜 (濡?BJS)'
        required: true
        default: 'BJS'
      to_name:
        description: '鐩殑鍦板悕绉?(濡?鍖椾含)'
        required: true
        default: '鍖椾含'
      depart_dates:
        description: '鍘荤▼鏃ユ湡, 閫楀彿鍒嗛殧 (濡?2026-09-30,2026-10-01)'
        required: true
        default: '2026-09-30,2026-10-01,2026-10-02'
      return_dates:
        description: '鍥炵▼鏃ユ湡, 閫楀彿鍒嗛殧 (鍙€?'
        required: false
        default: '2026-10-06'
      platforms:
        description: '骞冲彴: fliggy,tuniu,qunar,tongcheng,ctrip'
        required: false
        default: 'fliggy,tuniu,qunar,tongcheng'
      threshold:
        description: '浣庝环鎻愰啋闃堝€硷紙鍏冿級'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Build config from workflow_dispatch or defaults
        env:
          # SERVERCHAN_SEND_KEY is documented; SERVERCHAN_KEY is supported
          # for compatibility with existing repository secrets.
          SERVERCHAN_SEND_KEY: ${{ secrets.SERVERCHAN_SEND_KEY || secrets.SERVERCHAN_KEY }}
        run: |
          python scripts/build_config.py \
            --from-code "${{ github.event.inputs.from_code || 'LZO' }}" \
            --from-name "${{ github.event.inputs.from_name || '娉稿窞' }}" \
            --to-code "${{ github.event.inputs.to_code || 'BJS' }}" \
            --to-name "${{ github.event.inputs.to_name || '鍖椾含' }}" \
            --dates "${{ github.event.inputs.depart_dates || '2026-09-30,2026-10-01,2026-10-02' }}" \
            --return-dates "${{ github.event.inputs.return_dates || '2026-10-06' }}" \
            --platforms "${{ github.event.inputs.platforms || 'fliggy,tuniu,qunar,tongcheng' }}" \
            --threshold "${{ github.event.inputs.threshold || '0' }}" \
            --output config.yaml

      - name: Run price monitor (one round)
        run: python main.py --once
        timeout-minutes: 15

      - name: Export latest results to JSON
        run: |
          mkdir -p docs/data
          python scripts/export_results.py \
            --db data/prices.db \
            --out docs/data/latest.json

      - name: Render HTML report
        run: |
          python scripts/render_report.py \
            --results-file docs/data/latest.json \
            --out-dir docs/data

      - name: Commit data & report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update price data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

