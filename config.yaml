# 机票价格监控 示例配置
# 使用方法：复制为 config.yaml 后按需修改
#   Copy-Item config.example.yaml config.yaml


# 监控的航线列表（可配置多条）
routes:
  - from: CTU
    from_name: 成都
    to: TSN
    to_name: 天津
    dates:
      - "2026-10-04"
    alert_threshold: 800        # 低于此价触发提醒（元，0 表示不启用）


  - from: CTU
    from_name: 成都
    to: TSN
    to_name: 天津
    dates:
      - "2026-10-05"
      - "2026-10-06"
      - "2026-10-07"
    alert_threshold: 850


# 监控的平台（可选: ctrip, fliggy, tongcheng, qunar, tuniu）
# fliggy(飞猪) 与 tuniu(途牛) 为纯 httpx 逆向实现，无需浏览器
platforms:
  - fliggy
  - tuniu
  - qunar
  - tongcheng


# 同城机场组合会逐一查询并在报告中合并展示
airport_combinations:
  CTU: [CTU, TFU]
  TSN: [TSN]


# 首选平台缺失日期时，按此顺序低频降级；不做按请求轮换 IP
fallback:
  enabled: true
  platforms:
    - qunar
    - ctrip
    - tongcheng


# 调度配置
schedule:
  interval_minutes: 90        # 基础间隔（分钟）
  jitter_minutes: 30            # 随机扰动，实际间隔在 [interval-jitter, interval+jitter]
  run_on_start: true            # 启动时是否立即执行一次


# 爬虫配置
crawler:
  headless: true              # 无头模式；首次跑建议 false 以便观察反爬
  timeout_seconds: 45
  delay_min: 5                 # 单次请求间随机等待（秒）
  delay_max: 15
  max_attempts: 2              # 单日期最多重试圈数；风控时会提前熔断
  fliggy_max_poll: 3
  tuniu_max_poll: 6
  backoff_seconds: 8
  risk_cooldown_seconds: 900   # 命中风控后本轮停止该平台请求
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  mobile_user_agent: ""        # 留空用内置 iPhone Safari UA
  debug: true                  # 解析失败时保存截图+HTML 到 debug_dir
